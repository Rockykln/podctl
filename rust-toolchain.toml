[toolchain]
# The MSRV, and the oldest toolchain CI tests:
#   - if-let chains in the daemon / install / bluez code need 1.88.
#   - zbus 5.15+ requires 1.87.
# Nothing older than 1.89 has been tried. Edition 2024 itself only
# needs 1.85.
channel = "1.89"
components = ["clippy", "rustfmt"]
profile = "minimal"