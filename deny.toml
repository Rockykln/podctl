# cargo deny check — advisories, licences, duplicate crates, sources.
# The bundled Noto Sans font is not a crate; its licence is in NOTICE.md.

[graph]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]

[advisories]
version = 2
yanked = "deny"
ignore = [
    # Folded into zbus itself; leaving them means moving to the next zbus.
    { id = "RUSTSEC-2026-0370", reason = "zvariant: merged into zbus, no fix upstream" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names: merged into zbus, no fix upstream" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: merged into zbus, no fix upstream" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser: unmaintained, no successor; popup text only" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "Unicode-3.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
